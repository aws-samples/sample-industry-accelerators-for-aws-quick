[project]
name = "code-sandbox-mcp"
version = "0.1.0"
description = "Code sandbox MCP server for Amazon Bedrock AgentCore Runtime: runs Python and bash in the session's microVM"
license = "MIT-0"
requires-python = ">=3.13,<3.14"
# The server's own dependencies only. The packages available to sandboxed code
# come from environments/<environment>/ and live in a separate virtual
# environment.
dependencies = [
    "mcp==2.3.0",
]

[project.scripts]
code-sandbox-mcp = "code_sandbox_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "httpx>=0.28.1,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_sandbox_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
